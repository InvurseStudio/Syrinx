[package]
name = "vireo-server"
description = "Serves a GGUF model on this PC over the Vireo app's API, with Vireo's own engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
vireo-engine = { path = "../vireo-engine" }

# The Mac's document readers (PDFKit, AppKit) for read_file, through objc2's thin
# bindings as the engine reaches Metal.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
